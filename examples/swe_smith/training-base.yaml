experiment:
  include_routed_experts: false

actor_rollout_ref:
  model:
    lora:
      merge: true
    use_fused_kernels: true

  actor:
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1e-6
    clip_ratio_high: 0.28
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      entropy_from_logits_with_chunking: true

  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    temperature: 1.0
    val_kwargs:
      temperature: 0.7
    engine_kwargs:
      vllm:
        enable_auto_tool_choice: true
        moe_backend: triton
        gdn_prefill_backend: triton
    checkpoint_engine:
      update_weights_bucket_megabytes: 4096

algorithm:
  adv_estimator: grpo

trainer:
  logger: [console, tensorboard]
  project_name: arbas

agentlightning:
  max_ppo_update_times: 2
  trace_aggregator:
    trajectory_max_prompt_length: ${data.max_prompt_length}
    trajectory_max_response_length: ${data.max_response_length}
    trajectory_max_total_length: ${actor_rollout_ref.rollout.max_model_len}

ray_kwargs:
  ray_init:
    address: local
    runtime_env:
      env_vars:
        MAX_JOBS: "2"
        VLLM_USE_FLASHINFER_MOE_FP16: "0"

agents:
  SMITH_CMD_TIMEOUT: 120
  SMITH_EVAL_TIMEOUT: 600
  HIER_API_TIMEOUT: 120
  SMITH_GATEWAY_WAIT_S: 600
  SMITH_OBS_CHAR_CAP: 6000
  SMITH_F2P_ONLY: true
  SMITH_LEN_PEN_T0: 80
  SMITH_LEN_PEN_LAMBDA: 0.1
  SMITH_PROMPT_PEN_SOFT_START: 50000
  SMITH_PROMPT_PEN_HARD_CAP: 64000
  SMITH_PROMPT_PEN_MAX: 0.1

  ORCHESTRATOR_MODEL: auto
  ORCHESTRATOR_TEMPERATURE: ${actor_rollout_ref.rollout.temperature}
  ORCHESTRATOR_REASONING: null
  SUBAGENT_BASE_URL: https://openrouter.ai/api/v1
  SUBAGENT_MODEL: qwen/qwen3.5-9b
  SUBAGENT_TEMPERATURE: 0.7
  SUBAGENT_REASONING: null

  ORACLE_MODELS: []
  ORACLE_CHECKPOINT: auto
  ORACLE_COST_WEIGHT: 0.2
  ORACLE_COST_REF: 10000
  ORACLE_LEARN: true
  ORACLE_SEED: 0
  ORACLE_FEEDBACK: semantic

  JUDGE_BASE_URL: ""
  JUDGE_MODEL: qwen/qwen3.5-9b
  JUDGE_TEMPERATURE: 0
  JUDGE_MAX_TOKENS: 1024
  JUDGE_REASONING: null
