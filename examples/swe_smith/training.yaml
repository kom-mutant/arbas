base: training-base.yaml

experiment:
  name: h200-grpo-2b
  check_smoke: true

data:
  train_files: train_dataset_mixed.jsonl
  val_files: smoke_val.jsonl  # Trainer loads this split even with validation disabled.
  max_train_instances: 2
  train_batch_size: 1
  max_prompt_length: 16384
  max_response_length: 16384

actor_rollout_ref:
  model:
    path: Qwen/Qwen3.5-2B
    lora_rank: 0
    lora_alpha: 32
  rollout:
    n: 8
    max_model_len: 32768
    gpu_memory_utilization: 0.8
    enforce_eager: true

trainer:
  n_gpus_per_node: 1
  total_epochs: 1
  val_before_train: false
  save_freq: 4

ray_kwargs:
  ray_init:
    num_cpus: 8
    object_store_memory: 4294967296  # 4 GiB
reward:
  num_workers: 2

agents:
  SMITH_MAX_TURNS: 32
  SUBAGENT_MAX_STEPS: 16
  AGL_MAX_TOKENS: 4096
  SUBAGENT_MAX_TOKENS: 4096
