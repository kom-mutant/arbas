actor_rollout_ref:
  model:
    lora:
      merge: true
    use_fused_kernels: true
  actor:
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1e-6
    clip_ratio_high: 0.28
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      entropy_from_logits_with_chunking: true
  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    temperature: 1.0
    val_kwargs:
      temperature: 0.7
    engine_kwargs:
      vllm:
        enable_auto_tool_choice: true
        moe_backend: triton
        gdn_prefill_backend: triton
    checkpoint_engine:
      update_weights_bucket_megabytes: 4096

algorithm:
  adv_estimator: grpo

trainer:
  logger: [console, tensorboard]
  project_name: arbas

agentlightning:
  max_ppo_update_times: 2
  trace_aggregator:
    trajectory_max_prompt_length: ${data.max_prompt_length}
    trajectory_max_response_length: ${data.max_response_length}
    trajectory_max_total_length: ${actor_rollout_ref.rollout.max_model_len}

ray_kwargs:
  ray_init:
    address: local
    runtime_env:
      env_vars:
        MAX_JOBS: "2"
        VLLM_USE_FLASHINFER_MOE_FP16: "0"

agents:
  orchestrator:
    model: auto
    temperature: ${actor_rollout_ref.rollout.temperature}
    reasoning: null
  subagent:
    base_url: https://openrouter.ai/api/v1
    temperature: 0.7
    reasoning: null
  sandbox:
    cmd_timeout: 120
    eval_timeout: 600
    api_timeout: 120
    gateway_wait_s: 600
    obs_char_cap: 6000
    f2p_only: true
  reward:
    len_pen_t0: 80
    len_pen_lambda: 0.1
    prompt_pen_soft_start: 50000
    prompt_pen_hard_cap: 64000
    prompt_pen_max: 0.1
  oracle:
    models: []
    checkpoint: auto
    cost_weight: 0.2
    cost_ref: 10000
    learn: true
    seed: 0
    feedback: semantic
  judge:
    base_url: ""
    model: qwen/qwen3.5-9b
    temperature: 0
    max_tokens: 1024
    reasoning: null
