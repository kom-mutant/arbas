# Uses local ":arbas" images prepared by pull_images.py (SWE-smith + OpenAI SDK,
# Pydantic and NumPy).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ job_name }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: agl-rollout
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: {{ (input.image_name ~ ":arbas") | yaml_escape }}
          command: ["bash", "-lc", "set -o pipefail && mkdir -p /agl-logs/new && cd /agl && python -m hierarchical.run 2>&1 | tee /agl-logs/new/{{ job_name }}.log"]
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: swe-smith-settings
          env:
            - name: AGL_TASK_INPUT
              value: {{ input.problem_statement | yaml_escape }}
            - name: HIER_OUTPUT_DIR
              value: "/agl-logs/new/{{ job_name }}"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swe-smith-openrouter
                  key: api-key
          resources:
            requests:
              cpu: "50m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "6Gi"
          volumeMounts:
            - name: agent-scripts
              mountPath: /agl/hierarchical
              readOnly: true
            - name: oracle-scripts
              mountPath: /agl/hierarchical/oracle
              readOnly: true
            - name: rollout-logs
              mountPath: /agl-logs
      volumes:
        - name: agent-scripts
          configMap:
            name: swe-smith-agent-scripts
            defaultMode: 0755
        - name: rollout-logs
          hostPath:
            path: /agl-logs
            type: DirectoryOrCreate
        - name: oracle-scripts
          configMap:
            name: swe-smith-oracle-scripts
            defaultMode: 0755
