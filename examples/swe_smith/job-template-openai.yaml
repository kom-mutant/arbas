# Uses local ":arbas" images prepared by pull_images.py (SWE-smith + OpenAI SDK,
# Pydantic and NumPy).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ job_name }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: agl-rollout
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: {{ (input.image_name ~ ":arbas") | yaml_escape }}
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export HIER_OUTPUT_DIR="/agl-logs/$AGL_RUN_NAME/{{ job_name }}"
              mkdir -p "$HIER_OUTPUT_DIR"
              cd /agl
              python -m hierarchical.run 2>&1 | tee "$HIER_OUTPUT_DIR/$AGL_RUN_NAME-{{ job_name }}.log"
          imagePullPolicy: IfNotPresent
          env:
            - name: ARBAS_AGENT_CONFIG
              value: {{ input.arbas_agent_config | yaml_escape }}
            - name: AGL_RUN_NAME
              value: {{ input.agl_run_name | yaml_escape }}
            - name: AGL_TASK_INPUT
              value: {{ input.problem_statement | yaml_escape }}
            - name: AGL_ROLLOUT_JOB_NAME
              value: {{ job_name | yaml_escape }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swe-smith-openrouter
                  key: api-key
                  optional: true
            - name: POLZA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swe-smith-polza
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "6Gi"
          volumeMounts:
            - name: agent-scripts
              mountPath: /agl/hierarchical
              readOnly: true
            - name: rollout-logs
              mountPath: /agl-logs
      volumes:
        - name: agent-scripts
          configMap:
            name: swe-smith-agent-scripts
            defaultMode: 0755
        - name: rollout-logs
          hostPath:
            path: /agl-logs
            type: DirectoryOrCreate
